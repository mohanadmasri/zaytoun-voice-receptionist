# docker compose up --build
# Starts the simulated clinic API on http://localhost:8101.
# Uncomment the app block when your own service has a Dockerfile in the repo root.
services:
  clinic-api:
    build:
      context: .
      dockerfile: services/Dockerfile
    ports:
      - "8101:8101"
    environment:
      CLINIC_API_KEY: ${CLINIC_API_KEY:-dev-key-change-me}
      CLINIC_TODAY: ${CLINIC_TODAY:-}
      CLINIC_TIME: ${CLINIC_TIME:-}

  # app:
