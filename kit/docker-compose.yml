services:
  clinic-api:
    build:
      context: .
      dockerfile: services/Dockerfile
    ports:
      - "127.0.0.1:${CLINIC_HOST_PORT:-8101}:8101"
    environment:
      CLINIC_API_KEY: ${CLINIC_API_KEY:-dev-key-change-me}
      CLINIC_TODAY: ${CLINIC_TODAY:-}
      CLINIC_TIME: ${CLINIC_TIME:-}

  app:
    build: .
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CLINIC_API_URL: http://clinic-api:8101
      CLINIC_API_KEY: ${CLINIC_API_KEY:-dev-key-change-me}
    depends_on:
      clinic-api:
        condition: service_healthy
